[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "security-pr-guardian"
version = "0.1.0"
description = "CLI tool that analyzes Pull Requests combining SAST, CVE scanning, and LLM reasoning to filter false positives before reporting."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Security PR Guardian Team"}
]
keywords = ["security", "pull-request", "sast", "cve", "llm", "code-review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic==2.7.1",
    "pydantic-settings==2.5.2",
    "click==8.1.7",
    "rich==13.7.1",
    "httpx==0.27.2",
    "boto3==1.34.110",
    "anthropic==0.28.0",
    "mcp==1.9.4",
    "chromadb==0.5.0",
    "sentence-transformers==3.0.1",
    "jinja2==3.1.4",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-httpx==0.30.0",
    "hypothesis==6.103.1",
    "moto==5.0.9",
]

[project.scripts]
security-guardian = "security_pr_guardian.cli.main:cli"

[project.urls]
Homepage = "https://github.com/security-pr-guardian/security-pr-guardian"
Repository = "https://github.com/security-pr-guardian/security-pr-guardian"

[tool.setuptools.packages.find]
include = ["security_pr_guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["security_pr_guardian"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
# Global threshold — enforced by `pytest --cov-fail-under=80`
# Per-module thresholds enforced in .github/workflows/ci.yml:
#   security_pr_guardian/core/      ≥ 80 %
#   security_pr_guardian/adapters/  ≥ 80 %
#   security_pr_guardian/cli/       ≥ 70 %
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.paths]
# Canonical source roots for combining coverage across environments
source = [
    "security_pr_guardian/",
    "*/security_pr_guardian/",
]
